<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marbella CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0F6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marbella CRM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: nav rail + working area on desktop; bottom tab bar + one screen at a time on phones. */
:root {
  --bg: #F2F5F3; --surface: #FFFFFF; --sunk: #E8EDEA; --ink: #14201B; --muted: #5B6A63; --line: #D8E0DC;
  --accent: #0F6B57; --accent-soft: #DCEEE7; --accent-ink: #FFFFFF;
  --red: #C0402C; --red-soft: #F8E1DC; --amber: #A86A12; --amber-soft: #F6E9D2; --green: #2E7D55; --green-soft: #DDF0E5;
  --wa: #1FA855; --bubble-in: #FFFFFF; --bubble-out: #D9F5DF; --chat-bg: #E9E4DA;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 16px;
  --shadow: 0 1px 2px rgba(16,32,26,.05), 0 8px 24px -12px rgba(16,32,26,.14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --bg: #0E1412; --surface: #16201C; --sunk: #1C2723; --ink: #E4ECE8; --muted: #93A39C; --line: #27332F;
  --accent: #3FB394; --accent-soft: #173A31; --accent-ink: #05110D;
  --red: #F07B65; --red-soft: #3A1F1A; --amber: #E2AA4C; --amber-soft: #36290F; --green: #5DC48D; --green-soft: #15301F;
  --wa: #35C46C; --bubble-in: #1F2A26; --bubble-out: #144431; --chat-bg: #111917; color-scheme: dark } }
:root[data-theme="dark"] {
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --bg: #0E1412; --surface: #16201C; --sunk: #1C2723; --ink: #E4ECE8; --muted: #93A39C; --line: #27332F;
  --accent: #3FB394; --accent-soft: #173A31; --accent-ink: #05110D;
  --red: #F07B65; --red-soft: #3A1F1A; --amber: #E2AA4C; --amber-soft: #36290F; --green: #5DC48D; --green-soft: #15301F;
  --wa: #35C46C; --bubble-in: #1F2A26; --bubble-out: #144431; --chat-bg: #111917; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

.app { display: grid; grid-template-columns: 208px 1fr; height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding-block: 20px; padding-inline: 14px; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 8px 18px; }
.brand b { font-family: var(--display); font-size: 18px; white-space: nowrap; }
.demo-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); background: var(--amber-soft); padding: 2px 6px; border-radius: 4px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 0; background: none; text-align: left; color: var(--muted); font-weight: 500; text-decoration: none; }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav:hover { background: var(--sunk); color: var(--ink); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 11px; background: var(--red); color: #fff; border-radius: 99px; padding: 0 7px; font-weight: 600; }
.rail-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; font-size: 12px; }
.agent-mini { display: flex; gap: 10px; align-items: center; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12px; background: var(--accent-soft); color: var(--accent); flex: none; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; text-align: left; }

main { min-width: 0; overflow: auto; }
.page { padding-block: 24px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 26px; }
.page-head p { margin: 2px 0 0; color: var(--muted); }

.btn { text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; flex: none; }

/* Hotlist */
.split { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; height: 100%; }
.list-col { border-right: 1px solid var(--line); overflow: auto; background: var(--surface); }
.list-col .page-head { padding: 22px 20px 0; margin-bottom: 8px; }
.list-col .page-head h1 { font-size: 24px; }
.horizon { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 20px 12px; }
.horizon select { font: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 4px; }
.group { padding: 12px 0 4px; }
.group-head { display: flex; align-items: center; gap: 8px; padding: 0 20px 6px; }
.group-head h2 { font-size: 13px; font-family: var(--body); font-weight: 600; }
.group-head .n { font-size: 12px; color: var(--muted); }
.stripe { width: 3px; height: 14px; border-radius: 2px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 20px; border: 0; background: none; text-align: left; width: 100%; border-top: 1px solid var(--line); }
.row:hover { background: var(--sunk); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row .name { font-weight: 600; display: flex; gap: 6px; align-items: center; min-width: 0; }
.row .name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .why { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink); }
.row .meta { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.handled { padding: 9px 20px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 12.5px; }
.handled svg { width: 16px; height: 16px; color: var(--green); margin-top: 2px; }
.handled b { font-weight: 600; }
.handled .t { font-size: 11.5px; color: var(--muted); }
.empty { padding: 14px 20px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }
.detail-col { overflow: auto; min-width: 0; }

/* Client */
.client { padding-block: 22px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; max-width: 980px; }
.client-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.client-top h1 { font-size: 28px; }
.client-sub { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); margin-top: 4px; font-size: 13px; }
.back { display: none; }
.next { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 10px; }
.next.overdue { border-left-color: var(--red); }
.next-main { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.next h2 { font-size: 22px; line-height: 1.25; max-width: 32ch; }
.next .when { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.next .when b { color: var(--ink); font-weight: 500; }
.next.overdue .when b { color: var(--red); }
.next-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.next .ev { font-size: 12px; color: var(--muted); }
.inline-form { display: grid; gap: 8px; background: var(--sunk); padding: 12px; border-radius: 8px; }
.inline-form .f { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-form input, .inline-form select { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.inline-form input[type=text] { flex: 1 1 220px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.panel h3 { font-size: 15px; font-family: var(--body); font-weight: 600; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--sunk); padding: 4px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; }
.chip.new { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.match { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; }
.match .ph { width: 72px; height: 54px; border-radius: 6px; }
.match .t { font-weight: 600; font-size: 13px; }
.match .s { font-size: 12px; color: var(--muted); }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.tl:first-child { border-top: 0; }
.tl .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--muted); }
.tl .ic svg { width: 15px; height: 15px; }
.tl .ic.wa { background: var(--green-soft); color: var(--wa); }
.tl .ic.sys { background: var(--accent-soft); color: var(--accent); }
.tl .what { font-weight: 600; font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tl .quote { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tl .foot { display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }

/* Funnel */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunk); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 320px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px; }
.col-head h2 { font-size: 13px; font-family: var(--body); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 4px; text-align: left; cursor: grab; }
.card:active { cursor: grabbing; }
.card .n { font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.card .s { font-size: 12px; color: var(--muted); }
.card .d { font-size: 11.5px; font-family: var(--mono); color: var(--muted); }

/* Listings */
.listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.listing { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; }
.listing .ph { height: 150px; }
.listing .body { padding: 14px 16px; display: grid; gap: 8px; }
.listing .price { font-family: var(--display); font-size: 20px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.stat b { display: block; font-family: var(--mono); font-size: 16px; font-weight: 500; }
.stat span { font-size: 11px; color: var(--muted); }

/* Photo placeholders */
.ph { position: relative; overflow: hidden; background: var(--sunk); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph::after { z-index: 1; }
.ph::after { content: attr(data-cap); position: absolute; left: 8px; bottom: 6px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); font-weight: 500; }

/* Sheet */
.sheet-wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 32px; align-items: start; }
.phone { background: #0B0F0D; border-radius: 34px; padding: 10px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.45); max-width: 420px; }
.phone-screen { background: #FFFFFF; color: #1A1A1A; border-radius: 26px; overflow: hidden; max-height: 760px; overflow-y: auto; }
.ms-cover { height: 250px; }
.ms { padding: 18px 20px 24px; display: grid; gap: 14px; font-family: var(--body); }
.ms .price { font-family: var(--display); font-size: 28px; font-weight: 700; color: #111; }
.ms .area { color: #555; font-size: 14px; margin-top: -10px; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #E6E6E6; border-bottom: 1px solid #E6E6E6; padding: 10px 0; text-align: center; }
.facts b { display: block; font-size: 16px; font-family: var(--mono); font-weight: 500; color: #111; }
.facts span { font-size: 10.5px; color: #666; text-transform: uppercase; letter-spacing: .06em; }
.ms p { margin: 0; line-height: 1.6; color: #2A2A2A; }
.grid-ph { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.grid-ph .ph { height: 110px; border-radius: 4px; }
.ms-map { border-radius: 8px; overflow: hidden; background: #DCEBF2; }
.agent-card { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; border: 1px solid #E6E6E6; border-radius: 12px; padding: 12px; }
.agent-card .avatar { width: 48px; height: 48px; background: #E5EFEB; color: #0F6B57; font-size: 15px; }
.agent-card .wa-btn { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 8px; background: #1FA855; color: #fff; border: 0; border-radius: 10px; padding: 11px; font-weight: 600; }
.ref { font-family: var(--mono); font-size: 11.5px; color: #777; text-align: center; }
.sheet-side { display: grid; gap: 14px; }
.langs-app { display: flex; gap: 4px; flex-wrap: wrap; }
.ms-for { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #777; font-weight: 600; }
.ms-hl { display: flex; flex-wrap: wrap; gap: 6px; }
.ms-hl span { font-size: 12px; font-weight: 500; color: #222; background: #F1F3F2; border-radius: 99px; padding: 4px 10px; }
.ms-note { background: #F6F7F6; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #222; }
.ms-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin: 0; border-top: 1px solid #E6E6E6; }
.ms-facts div { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #EFEFEF; font-size: 12.5px; }
.ms-facts dt { color: #777; }
.ms-facts dd { margin: 0; color: #111; font-weight: 500; text-align: right; }
.ms-note-h { font-size: 11px; font-weight: 600; color: #777; margin-bottom: 4px; }

/* Send sheet composer */
.compose { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 28px; align-items: start; }
.q-panel { gap: 18px; padding: 20px 22px; }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.stepper button { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px 4px 4px; font-size: 12px; color: var(--muted); }
.stepper button svg { width: 12px; height: 12px; }
.stepper li.on button { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.stepper li.done button { color: var(--ink); }
.stepper button:disabled { opacity: .55; cursor: default; }
.q { display: grid; gap: 10px; }
.q h2 { font-size: 22px; }
.q p { margin: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; text-align: left; }
.opt:hover { border-color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.opt-tag { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .75; margin-left: 4px; }
.cover-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
.cover-opt { border: 2px solid transparent; border-radius: 10px; padding: 0; overflow: hidden; background: none; }
.cover-opt .ph { height: 84px; }
.cover-opt[aria-pressed="true"] { border-color: var(--accent); }
.q textarea { font: inherit; width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 10px 12px; resize: vertical; }
.q textarea:disabled { opacity: .5; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.q-nav { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.chat.wa-preview { min-height: 0; }
.link-card { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; background: var(--surface); border-radius: 8px; padding: 6px; font-size: 12.5px; }
.link-card .ph { height: 48px; border-radius: 6px; }
.preview-col { display: grid; gap: 8px; position: sticky; top: 16px; }
.preview-col .phone-screen { max-height: 680px; }

/* Chat (add property + simulator) */
.chat-layout { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 24px; align-items: start; }
.chat { background: var(--chat-bg); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 420px; }
.b { max-width: 85%; padding: 8px 11px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 1px 1px rgba(0,0,0,.08); display: grid; gap: 6px; }
.b.in { background: var(--bubble-in); align-self: flex-start; border-top-left-radius: 2px; }
.b.out { background: var(--bubble-out); align-self: flex-end; border-top-right-radius: 2px; }
.b .who { font-size: 11.5px; font-weight: 600; color: var(--accent); }
.b .ts { font-size: 10.5px; color: var(--muted); justify-self: end; font-family: var(--mono); }
.b.sys { background: var(--surface); border: 1px solid var(--line); align-self: stretch; max-width: none; box-shadow: none; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.thumbs .ph { height: 64px; border-radius: 4px; }
.thumbs .ph.cover { outline: 3px solid var(--accent); outline-offset: -3px; }
.thumbs .ph.bad { filter: blur(1.5px) grayscale(.5); opacity: .55; }
.replies { display: flex; gap: 6px; flex-wrap: wrap; }
.replies .btn { border-radius: 99px; }
.interp { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.interp dt { color: var(--muted); }
.interp dd { margin: 0; font-weight: 500; }

function suggestNext(c) {
  const f = firstName(c);
  switch (c.stage) {
    case "new_lead": return c.role === "seller"
      ? { text: `Send ${f} the mandate agreement`, days: 1, owner: "agent" }
      : { text: `Ask ${f} what they’re looking for and when they’re here`, days: 1, owner: "agent" };
    case "searching": return { text: `Send ${f} 2–3 properties`, days: 2, owner: "agent" };
    case "viewing": return { text: `Ask ${f} what they thought and whether to make an offer`, days: 2, owner: "agent" };
    case "offer": return { text: `Seller’s answer on ${f}’s offer`, days: 2, owner: "other" };
    case "reservation": return { text: `Lawyer sends ${f} the arras draft`, days: 5, owner: "other" };
    case "arras": return { text: `Confirm the notary date with ${f}`, days: 7, owner: "other" };
    case "parked": return { text: `Check in with ${f}`, days: 60, owner: "agent" };
    default: return { text: `Check in with ${f}`, days: 3, owner: "agent" };
  }
}
function applySuggested(c) {
  const sg = suggestNext(c);
  c.next = { text: sg.text, date: addDays(sg.days), owner: sg.owner, ev: "Suggested from the stage. Change it any time.", suggested: true };
  return c.next;
}

// ---------- Hotlist rules ----------
const ACTIVE = new Set(["new_lead", "searching", "viewing", "offer", "reservation", "arras"]);
function reasons(c) {
  const r = [];
  if (c.snooze && daysBetween(NOW, c.snooze) > 0) return r;
  const f = c.flags;
  if (f.unanswered) {
    const h = Math.round((NOW - d(f.unanswered.at)) / 36e5);
    if (h >= 24) r.push({ level: "red", text: `Unanswered question, ${h}h`, detail: `“${f.unanswered.text}”` });
  }
  if (f.silentAfterSend >= 3) r.push({ level: "red", text: `Silent ${f.silentAfterSend} days after receiving properties` });
  if (f.newMatch) r.push({ level: "red", text: "New Resales match", detail: `${f.newMatch} · ${PROPS[f.newMatch].area}` });
  if (f.viewingNoFollowUp) r.push({ level: "red", text: "Viewing done, no follow-up yet" });
  if (ACTIVE.has(c.stage) && !c.next) r.push({ level: "red", text: "No next step" });
  if (c.next) {
    const n = daysBetween(NOW, c.next.date);
    if (n < 0) r.push({ level: "red", text: `Next step overdue by ${-n} day${n === -1 ? "" : "s"}` });
    else if (n <= state.horizon) r.push({ level: "amber", text: `${c.next.text}`, due: true });
  }
  return r;
}
function hotGroups() {
  const needs = [], coming = [];
  for (const c of state.clients) {
    const r = reasons(c);
    if (r.some(x => x.level === "red")) needs.push([c, r]);
    else if (r.length) coming.push([c, r]);
  }
  const byDate = ([a], [b]) => (a.next ? a.next.date : "0") < (b.next ? b.next.date : "0") ? -1 : 1;
  return { needs, coming: coming.sort(byDate) };
}

  if (f.viewingNoFollowUp) return "feedback";

}
function searchResults(q) {

  const cs = state.clients.filter(c => !q || c.name.toLowerCase().includes(q) || c.lang.toLowerCase().includes(q))

// ---------- Router and events ----------
function route() {
  const h = (location.hash || "#hotlist").slice(1);
  state.editing = state.editing && state.editingRoute === h ? state.editing : null;
  renderRail(h);
  if (h.startsWith("client-") && C(h.slice(7))) renderHotlist(h.slice(7));
  else if (h === "funnel") renderFunnel();
  else if (h === "listings") renderListings();
  else if (h.startsWith("sheet-")) renderSheet(h.slice(6));
  else if (h.startsWith("site-")) renderSite(h.slice(5));
  else if (h.startsWith("send-")) { const [, cid, ref] = h.split("-"); renderCompose(cid, ref); }
  else if (h.startsWith("pdf-")) { const [, cid, ref] = h.split("-"); renderPdf(cid, ref); }
  else if (h === "add") renderAdd();
  else if (h === "live") renderLive();
  else renderHotlist(null);
}
function rerender() { state.editingRoute = (location.hash || "#hotlist").slice(1); route(); }
function edit(key) { state.editing = key; rerender(); }
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }

    case "done": {
      c.tl.unshift({ at: "2026-10-28T10:30", src: "sys", what: "Done: " + c.next.text, q: "" });
      ["unanswered", "silentAfterSend", "newMatch", "viewingNoFollowUp"].forEach(f => delete c.flags[f]);
      const n = applySuggested(c);
      toast(`Done. Next: ${n.text}, ${fmtDay(n.date)}.`); rerender(); break; }
    case "edit-next": edit("next-" + id); break;
    case "use-suggest": { const n = applySuggested(c); toast(`Next: ${n.text}, ${fmtDay(n.date)}.`); rerender(); break; }
    case "move": edit("move-" + id); break;
    case "cancel": edit(null); break;
    case "next-save": {
      const text = document.getElementById("next-text").value.trim();
      if (!text) { toast("Write what happens next first."); break; }
      c.next = { text, date: document.getElementById("next-date").value || addDays(1), owner: document.getElementById("next-owner").value, ev: "Set by you" };
      toast("Next step saved"); edit(null); break; }
    case "move-to": {
      c.stage = el.dataset.stage; c.tl.unshift({ at: "2026-10-28T10:30", src: "sys", what: "Moved to " + stageName(c.stage), q: "" });
      const n = applySuggested(c);
      toast(`Moved to ${stageName(c.stage)}. Next: ${n.text}.`); edit(null); break; }
    case "fix": edit(`tl-${id}-${el.dataset.i}`); break;
    case "fix-save": {
      const t = c.tl[+el.dataset.i]; t.what = document.getElementById("fix-type").value + (t.what.includes("·") ? " ·" + t.what.split("·").slice(1).join("·") : ""); t.corrected = true;
      toast("Corrected. Saved as training data."); edit(null); break; }
    case "send": go(`send-${id}-${el.dataset.ref}`); break;
    case "q-done": {
      c.tl.unshift({ at: "2026-10-28T10:30", src: "sys", what: "Done: " + (c.next ? c.next.text : reasons(c)[0].text), q: "" });
      ["unanswered", "silentAfterSend", "newMatch", "viewingNoFollowUp"].forEach(f => delete c.flags[f]);
      const n = applySuggested(c);
      state.handled.unshift({ at: "2026-10-28T10:30", text: `<b>${esc(c.name)}</b> marked done`, sub: `Next: ${n.text}, ${fmtDay(n.date)}` });
      toast(`Done. Next: ${n.text}, ${fmtDay(n.date)}.`); rerender(); break; }
    case "q-snooze": state.snoozeOpen = id; rerender(); break;
    case "q-snooze-cancel": state.snoozeOpen = null; rerender(); break;
    case "q-snooze-to": {
      c.snooze = addDays(+el.dataset.days); state.snoozeOpen = null;
      state.handled.unshift({ at: "2026-10-28T10:30", text: `<b>${esc(c.name)}</b> snoozed`, sub: `Back on the hotlist ${fmtDay(c.snooze)}` });
      toast(`${c.name} snoozed until ${fmtDay(c.snooze)}`); rerender(); break; }
    case "q-reply": { const lang = langFor(c); state.modal = { type: "reply", cid: id, lang, text: replyText(c, lang) }; renderModal(); break; }
    case "r-lang": { const m = state.modal; m.lang = el.dataset.l; m.text = replyText(C(m.cid), m.lang); renderModal(); break; }
    case "r-copy": {
      const text = document.getElementById("r-text").value;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("Copied"), () => { document.getElementById("r-text").select(); toast("Selected. Copy with ⌘C."); });
      break; }
    case "r-open": {
      const cl = C(state.modal.cid);
      ["unanswered", "silentAfterSend", "viewingNoFollowUp"].forEach(f => delete cl.flags[f]);
      cl.tl.unshift({ at: "2026-10-28T10:30", src: "wa", what: "Replied on WhatsApp", q: "Jonathan: “" + state.modal.text.slice(0, 80) + (state.modal.text.length > 80 ? "…”" : "”") });
      if (!cl.next) cl.next = { text: `Wait for ${firstName(cl)}’s reply`, date: addDays(2), owner: "client", ev: "Set after your reply" };
      closeModal(); toast(`Reply logged for ${cl.name}`); rerender(); break; }
    case "m-close": closeModal(); break;
    case "search": state.modal = { type: "search", q: "", i: 0 }; renderModal(); break;
    case "s-go": closeModal(); go(el.dataset.go); break;
    case "wa-ok": state.wa.dismissed = true; rerender(); break;
    case "c-skip": state.compose.step = STEPS.length - 1; rerender(); break;
    case "c-format": state.compose.format = el.dataset.f; rerender(); break;
    case "print": window.print(); break;
    case "c-lang": { const k = state.compose; k.lang = el.dataset.l; if (!k.noteEdited) k.note = T[k.lang].note(firstName(C(k.cid))); rerender(); break; }
    case "c-hl": {
      const k = state.compose, f = el.dataset.k;
      if (k.hl.includes(f)) { if (k.hl.length === 1) { toast("Keep at least one highlight."); break; } k.hl = k.hl.filter(x => x !== f); }
      else if (k.hl.length >= 3) { toast("Up to three. Remove one first."); break; }
      else k.hl = k.hl.concat(f);
      rerender(); break; }
    case "c-cover": state.compose.cover = +el.dataset.i; rerender(); break;
    case "c-next": state.compose.step++; rerender(); break;
    case "c-back": state.compose.step--; rerender(); break;
    case "c-goto": state.compose.step = +el.dataset.i; rerender(); break;
    case "c-send": {
      const ref = el.dataset.ref, link = sheetLink(id, ref), k = state.compose;
      state.sentLog.push(id + ref);
      c.tl.unshift({ at: "2026-10-28T10:30", src: "wa", what: (k.format === "pdf" ? "Sent PDF · " : "Sent sheet · ") + ref + (k.anon ? " (anonymous)" : ""), q: `${LANGS[k.lang]} · ${k.format === "pdf" ? "PDF, A4" : link}` });
      if (c.flags.newMatch === ref) delete c.flags.newMatch;
      state.compose = null;
      toast(`Sheet sent to ${c.name} on WhatsApp`); go("client-" + id); break; }
    case "wa": toast(`In the live version this opens the WhatsApp chat with ${c ? c.name : "the client"}.`); break;
    case "wa-sheet": toast(`In the live version this opens WhatsApp with ${AGENT.name}, and the tap is logged.`); break;
    case "lang": state.sheetLang = el.dataset.l; rerender(); break;
    case "site-lang": state.siteLang = el.dataset.l; rerender(); window.scrollTo(0, 0); break;
    case "site-upload": toast("In the live app this opens a file picker. Plans appear on the site as a per-floor viewer."); break;
    case "add-send-msg": { const d = document.querySelector(".draft-text"); state.add.text = d ? d.textContent.trim() : ""; state.add.step = 1; rerender(); break; }
    case "add-confirm": state.add.step = 2; rerender(); break;
    case "add-fix": toast("In the live app you just reply in the chat, for example “4 bedrooms, not 5”, and the card updates."); break;
    case "add-copy": { const text = ["Villa, El Paraíso Alto, Benahavís", "5 bedrooms, 4 bathrooms", "Built 420 m², plot 1,850 m²", "Asking price €2,950,000", "Pool: " + (state.add.answers[1] || ""), "Fees/IBI: " + (state.add.answers[2] || ""), "Photos: 5 (cover #3)"].join("\n");
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("Copied. Paste into the Resales listing form."), () => toast("Copy blocked by the browser here; works in the app.")); break; }
    case "add-answer": state.add.answers.push(el.dataset.a); state.add.step = state.add.answers.length === 3 ? 5 : state.add.answers.length + 2;
      if (state.add.step === 5 && !state.listings.includes(NEW_PROP.ref)) {
        state.listings.unshift(NEW_PROP.ref);
        ["olga", "mark", "henrik"].forEach(k => { const b = C(k); if (!b.matches.includes(NEW_PROP.ref)) b.matches.push(NEW_PROP.ref); });
        PROPS[NEW_PROP.ref] = NEW_PROP;
      }
      rerender(); break;
    case "add-send":
      state.add.sent = "yes";
      ["olga", "mark", "henrik"].forEach(k => { const b = C(k); state.sentLog.push(k + NEW_PROP.ref); b.tl.unshift({ at: "2026-10-28T10:36", src: "wa", what: "Sent sheet · " + NEW_PROP.ref, q: "New listing, El Paraíso Alto" }); });
      toast("Sheet sent to 3 buyers"); rerender(); break;
    case "add-skip": state.add.sent = "no"; rerender(); break;
    case "add-reset": state.add = { step: 0, answers: [] }; rerender(); break;
    case "sim-next": SIM[state.sim].apply(state); state.sim++; rerender(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "horizon") { state.horizon = +e.target.value; route(); }
  if (e.target.id === "c-noteon") { state.compose.noteOn = e.target.checked; rerender(); }
  if (e.target.id === "c-anon") { state.compose.anon = e.target.checked; rerender(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "s-q") { state.modal.q = e.target.value; state.modal.i = 0; document.getElementById("s-list").innerHTML = searchList(); return; }
  if (e.target.id === "r-text") { state.modal.text = e.target.value; document.getElementById("r-open").href = "https://wa.me/?text=" + encodeURIComponent(e.target.value); return; }
  if (e.target.id !== "c-note" || !state.compose) return;
  const k = state.compose; k.note = e.target.value; k.noteEdited = true;
  document.getElementById("c-preview").innerHTML = sheetHTML(PROPS[k.ref] || NEW_PROP, composeOpts(C(k.cid), k));
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); state.modal = { type: "search", q: "", i: 0 }; renderModal(); return; }
  if (state.modal) {
    if (e.key === "Escape") return closeModal();
    if (state.modal.type === "search" && ["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) {
      e.preventDefault();
      const rows = document.querySelectorAll(".s-row");
      if (e.key === "Enter") { if (rows[state.modal.i]) { const g = rows[state.modal.i].dataset.go; closeModal(); go(g); } return; }
      state.modal.i = Math.max(0, Math.min(rows.length - 1, state.modal.i + (e.key === "ArrowDown" ? 1 : -1)));
      document.getElementById("s-list").innerHTML = searchList();
    }
    return;
  }
  if (e.key === "Enter" && e.target.matches(".card[data-go], .row[data-go]") && !e.target.closest("[data-act]")) go(e.target.dataset.go);
});

// Swipe left on a hotlist row (phones) to show its quick actions
let swipe = null;
document.addEventListener("touchstart", e => { const r = e.target.closest(".row[data-swipe]"); swipe = r ? { r, x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
document.addEventListener("touchend", e => {
  if (!swipe) return;
  const dx = e.changedTouches[0].clientX - swipe.x, dy = e.changedTouches[0].clientY - swipe.y;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    document.querySelectorAll(".row.swiped").forEach(x => x !== swipe.r && x.classList.remove("swiped"));
    swipe.r.classList.toggle("swiped", dx < 0);
    swipe.r.dataset.justSwiped = "1"; setTimeout(() => delete swipe?.r?.dataset.justSwiped, 300);
  }
  swipe = null;
});

// Funnel drag and drop (desktop)
document.addEventListener("dragstart", e => { const card = e.target.closest(".card"); if (card) e.dataTransfer.setData("text/plain", card.dataset.id); });
document.addEventListener("dragover", e => { const col = e.target.closest(".col"); if (col) { e.preventDefault(); col.classList.add("over"); } });
document.addEventListener("dragleave", e => { const col = e.target.closest(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });
document.addEventListener("drop", e => {
  const col = e.target.closest(".col"); if (!col) return;
  e.preventDefault();
  const c = C(e.dataTransfer.getData("text/plain"));
  if (c && c.stage !== col.dataset.stage) { c.stage = col.dataset.stage; c.tl.unshift({ at: "2026-10-28T10:30", src: "sys", what: "Moved to " + stageName(c.stage), q: "" }); toast(`${c.name} → ${stageName(c.stage)}`); }
  renderFunnel(); renderRail("funnel");
});

window.addEventListener("hashchange", () => { state.editing = null; route(); });
route();
</script>

</body>
